apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fib-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: fib.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fib-svc
            port:
              number: 80
